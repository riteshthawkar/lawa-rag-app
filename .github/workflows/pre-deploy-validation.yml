name: Pre-Deploy Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit and mocked integration tests
        run: pytest -m "not live" --maxfail=1 --disable-warnings

  live-provider-smoke:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_PROVIDER_TESTS: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || secrets.PINECONE_INDEX_NAME }}
      MAIN_MODEL: gpt-5.4
      QUERY_REWRITING_MODEL: gpt-5.4-mini
      FALLBACK_MODEL: gpt-5.4-mini

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate required secrets
        run: |
          missing=0
          for var in OPENAI_API_KEY PINECONE_API_KEY PINECONE_INDEX_NAME; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is required for live validation"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run live OpenAI and Pinecone smoke tests
        run: pytest -m live tests/test_live_smoke.py --maxfail=1 --disable-warnings

  local-live-semantic-regression:
    runs-on: ubuntu-latest
    needs: live-provider-smoke
    env:
      RUN_LIVE_PROVIDER_TESTS: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || secrets.PINECONE_INDEX_NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
      WEBSOCKET_TEST_TOKEN: ${{ secrets.WEBSOCKET_TEST_TOKEN }}
      MAIN_MODEL: gpt-5.4
      QUERY_REWRITING_MODEL: gpt-5.4-mini
      FALLBACK_MODEL: gpt-5.4-mini
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'google/embeddinggemma-300m' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HOST: 127.0.0.1
      PORT: "18080"
      LIVE_APP_BASE_URL: http://127.0.0.1:18080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate required app secrets
        run: |
          missing=0
          for var in OPENAI_API_KEY PINECONE_API_KEY PINECONE_INDEX_NAME SECRET_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is required for local live app regression"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Start app locally
        run: |
          nohup python main.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app readiness
        run: |
          python - <<'PY'
          from tests.live_utils import wait_for_http_ready
          wait_for_http_ready("http://127.0.0.1:18080", timeout_seconds=180)
          PY

      - name: Run live semantic regression tests
        run: pytest -m live tests/test_live_semantic_regression.py --maxfail=1 --disable-warnings

      - name: Upload local app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-live-semantic-app-log
          path: app.log

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi

  local-live-websocket-e2e:
    runs-on: ubuntu-latest
    needs: live-provider-smoke
    env:
      RUN_LIVE_PROVIDER_TESTS: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || secrets.PINECONE_INDEX_NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL || 'https://jellyfish-app-v7scu.ondigitalocean.app' }}
      DEMO_USER_EMAIL: ${{ secrets.DEMO_USER_EMAIL }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      MAIN_MODEL: gpt-5.4
      QUERY_REWRITING_MODEL: gpt-5.4-mini
      FALLBACK_MODEL: gpt-5.4-mini
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'google/embeddinggemma-300m' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HOST: 127.0.0.1
      PORT: "18080"
      LIVE_APP_BASE_URL: http://127.0.0.1:18080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate required websocket secrets
        run: |
          missing=0
          for var in OPENAI_API_KEY PINECONE_API_KEY PINECONE_INDEX_NAME SECRET_KEY BACKEND_URL DEMO_USER_EMAIL DEMO_USER_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is required for live websocket end-to-end validation"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize backend URL
        run: |
          python3 - <<'PY'
          import os

          raw_backend_url = os.environ["BACKEND_URL"].rstrip("/")
          normalized_backend_url = (
              raw_backend_url[:-4]
              if raw_backend_url.endswith("/api")
              else raw_backend_url
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"BACKEND_URL={normalized_backend_url}\n")
          PY

      - name: Mint websocket test token
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          payload = json.dumps(
              {
                  "username": os.environ["DEMO_USER_EMAIL"],
                  "password": os.environ["DEMO_USER_PASSWORD"],
              }
          ).encode()
          request = urllib.request.Request(
              f"{backend_url}/api/token/",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.loads(response.read().decode())
          except Exception as exc:
              print(
                  f"::error::Failed to mint websocket test token from {backend_url}/api/token/: {exc}"
              )
              raise

          access_token = body.get("access")
          if not access_token:
              print(
                  f"::error::Token endpoint did not return an access token: {json.dumps(body)}"
              )
              sys.exit(1)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"WEBSOCKET_TEST_TOKEN={access_token}\n")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Start app locally
        run: |
          nohup python main.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app readiness
        run: |
          python - <<'PY'
          from tests.live_utils import wait_for_http_ready
          wait_for_http_ready("http://127.0.0.1:18080", timeout_seconds=180)
          PY

      - name: Run live websocket end-to-end test
        run: pytest -m live tests/test_live_websocket_e2e.py --maxfail=1 --disable-warnings

      - name: Upload local app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-live-websocket-app-log
          path: app.log

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
