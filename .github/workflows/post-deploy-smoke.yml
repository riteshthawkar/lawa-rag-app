name: Post-Deploy Smoke

on:
  workflow_dispatch:

jobs:
  deployed-smoke:
    runs-on: ubuntu-latest
    env:
      DEPLOYED_BASE_URL: ${{ vars.DEPLOYED_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate deployed base URL
        run: |
          if [ -z "$DEPLOYED_BASE_URL" ]; then
            echo "::error::DEPLOYED_BASE_URL repository variable is required"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run deployed environment smoke tests
        run: pytest -m deployed tests/test_deployed_smoke.py --maxfail=1 --disable-warnings
