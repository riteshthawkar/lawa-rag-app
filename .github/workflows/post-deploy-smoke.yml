name: Post-Deploy Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Pre-Deploy Validation
    types:
      - completed

jobs:
  deployed-smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    env:
      DEPLOYED_BASE_URL: ${{ vars.DEPLOYED_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate deployed base URL
        run: |
          if [ -z "$DEPLOYED_BASE_URL" ]; then
            echo "::error::DEPLOYED_BASE_URL repository variable is required"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for deployed app readiness
        run: |
          python - <<'PY'
          import os
          from tests.live_utils import wait_for_http_ready

          wait_for_http_ready(os.environ["DEPLOYED_BASE_URL"], timeout_seconds=600)
          PY

      - name: Run deployed environment smoke tests
        run: pytest -m deployed tests/test_deployed_smoke.py --maxfail=1 --disable-warnings
